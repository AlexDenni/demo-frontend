name: Frontend CI/CD

on:
  push:
    branches: learn
  pull_request:
    branches: learn
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================
  # Stage 1: Unit Test
  # ============================================================
  unit-test:
    name: "Stage 1: Unit Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watchAll=false --coverage
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7


  # ============================================================
  # Stage 2: Code Quality
  # ============================================================
  code-quality:
    name: "Stage 2: Code Quality"
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  # ============================================================
  # Stage 3: Build & Artifact
  # ============================================================
  build:
    name: "Stage 3: Build & Artifact"
    needs: code-quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      commit_id: ${{ steps.vars.outputs.commit_id }}
      artifact_name: ${{ steps.vars.outputs.artifact_name }}

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate commit ID
        id: vars
        run: |
          COMMIT_ID="${GITHUB_SHA:0:7}"
          echo "commit_id=$COMMIT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=demo-frontend-$COMMIT_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            -t demo-frontend:${{ steps.vars.outputs.commit_id }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            demo-frontend:${{ steps.vars.outputs.commit_id }} \
            -o ${{ steps.vars.outputs.artifact_name }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ steps.vars.outputs.artifact_name }}.tar
          retention-days: 14


  # ============================================================
  # Stage 4: Deploy
  # ============================================================
  deploy:
    name: "Stage 4: Deploy"
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, production]
    timeout-minutes: 10

    environment: production

    permissions:
      actions: read

    env:
      COMMIT_ID: ${{ needs.build.outputs.commit_id }}
      ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
      IMAGE_NAME: demo-frontend
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      HOST_PORT: ${{ vars.HOST_PORT }}
      CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: .

      - name: Load Docker image
        run: |
          docker load -i "${ARTIFACT_NAME}.tar"

      - name: Deploy container
        run: |
          set -euo pipefail

          PREVIOUS_IMAGE=$(docker inspect \
            --format='{{.Config.Image}}' \
            "$CONTAINER_NAME" 2>/dev/null || echo "")

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$HOST_PORT:$CONTAINER_PORT" \
            "$IMAGE_NAME:$COMMIT_ID"

          for i in $(seq 1 10); do
            if curl -sf "http://localhost:$HOST_PORT" > /dev/null; then
              echo "Deployment successful."
              exit 0
            fi

            sleep 3
          done

          echo "Health check failed. Rolling back."

          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          if [ -n "$PREVIOUS_IMAGE" ]; then
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$HOST_PORT:$CONTAINER_PORT" \
              "$PREVIOUS_IMAGE"
          fi

          exit 1

      - name: Clean up old images
        if: always()
        run: |
          docker image prune -f --filter "until=72h" || true
